<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — Pitch AI</title>
  <link rel="stylesheet" href="css/pitch-ai.css" />
</head>
<body>
  <div class="login-page" data-od-id="login-page">
    <header class="app-header app-header--standalone" data-od-id="app-header">
        <a class="app-brand" href="login.html" data-od-id="app-brand">
          <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 10l7-7 7 7"/></svg></span>
          <strong>Pitch AI</strong>
        </a>
        <button type="button" class="theme-toggle" data-action="toggle-theme" data-od-id="theme-toggle" aria-pressed="false" aria-label="Включить светлую тему"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
      </header>

    <div class="login-card" data-od-id="login-card">
      <div class="login-brand" data-od-id="login-brand">
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 10l7-7 7 7"/></svg>
        </div>
        <h1>Pitch AI</h1>
      </div>

      <div data-otp-step="email" data-od-id="otp-email-step">
        <h2 data-od-id="login-title">Вход по email</h2>
        <p class="lead">Без пароля. Пришлём одноразовый код для доступа к студии.</p>
        <div class="field" data-field="email">
          <label for="login-email">Email</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input class="input" id="login-email" type="email" placeholder="you@startup.com" autocomplete="email" inputmode="email" required data-od-id="login-email" aria-describedby="login-email-hint login-email-error" />
          </div>
          <span class="field-hint" id="login-email-hint">Используем только для входа — без рассылок.</span>
          <span class="field-error" id="login-email-error" role="alert"></span>
        </div>
        <div class="login-actions">
          <button type="button" class="btn btn-primary" data-action="otp-send" data-od-id="otp-send">Получить код</button>
        </div>
      </div>

      <div data-otp-step="code" hidden data-od-id="otp-code-step">
        <h2>Введите код</h2>
        <p class="lead">Шестизначный код отправлен на <strong data-otp-email>ваш email</strong>. Действует 10 минут.</p>
        <div class="field" data-field="code">
          <label for="login-code">Код из письма</label>
          <input class="input code" id="login-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" data-od-id="login-code" aria-describedby="login-code-error" />
          <span class="field-error" id="login-code-error" role="alert"></span>
        </div>
        <div class="login-actions">
          <button type="button" class="btn btn-primary" data-action="otp-confirm" data-od-id="otp-confirm">Войти</button>
          <button type="button" class="btn btn-secondary" data-action="otp-back" data-od-id="otp-back">Изменить email</button>
        </div>
        <p class="login-meta">Не пришло? Проверьте спам или запросите код снова через 30 сек.</p>
      </div>
    </div>
  </div>
  <script src="js/pitch-ai.js"></script>
</body>
</html>
