<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Проверка записи — Pitch AI</title>
  <link rel="stylesheet" href="css/pitch-ai.css" />
</head>
<body>
  <div class="app-shell" data-od-id="app-shell">
    <aside class="sidebar" data-od-id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 10l7-7 7 7"/></svg>
        </div>
        <span>Pitch AI</span>
      </div>
      <nav class="sidebar-nav" aria-label="Основная навигация">
        <a class="nav-item active" href="studio.html" data-od-id="nav-studio" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
          Новая запись
        </a>
        <a class="nav-item" href="history.html" data-od-id="nav-history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
          История
        </a>
        <a class="nav-item" href="pitch-writer.html" data-od-id="nav-writer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          Питч Райтер
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="attempts-bar">
          <div class="attempts-bar-top"><span>Попытки</span><span class="mono">3 / 5</span></div>
          <div class="attempts-track"><div class="attempts-fill" style="width:60%"></div></div>
        </div>
        <div class="user-row">
          <div class="user-avatar" aria-hidden="true">А</div>
          <span class="user-email">anna@startup.io</span>
        </div>
      </div>
    </aside>

    <div class="main-col">
      <header class="app-header" data-od-id="app-header">
        <a class="app-brand" href="pitch-writer.html" data-od-id="app-brand">
          <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 10l7-7 7 7"/></svg></span>
          <strong>Pitch AI</strong>
        </a>
        <button type="button" class="theme-toggle" data-action="toggle-theme" data-od-id="theme-toggle" aria-pressed="false" aria-label="Включить светлую тему"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
      </header>

      <main class="main-content page" data-od-id="review-page">
        <div class="page-title">
          <div>
            <p class="caps">Попытка 3</p>
            <h1 data-od-id="review-title">Проверьте запись</h1>
            <p>01:12 · видео · можно переснять или отправить на AI-разбор</p>
          </div>
        </div>

        <div class="review-preview" data-od-id="review-preview">
          <button type="button" class="btn-record" data-action="toggle-play" aria-label="Воспроизвести" aria-pressed="false" data-od-id="review-play" style="width:64px;height:64px;">
            <svg data-icon="play" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg data-icon="pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true" hidden><rect x="7" y="6" width="3.5" height="12" rx="1"/><rect x="13.5" y="6" width="3.5" height="12" rx="1"/></svg>
          </button>
        </div>

        <div class="player-bar" data-od-id="review-player">
          <button type="button" data-action="toggle-play" aria-label="Воспроизвести" aria-pressed="false">
            <svg data-icon="play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg data-icon="pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><rect x="7" y="6" width="3.5" height="12" rx="1"/><rect x="13.5" y="6" width="3.5" height="12" rx="1"/></svg>
          </button>
          <div class="player-track" data-player-track><span data-player-fill style="width:18%"></span></div>
          <span class="mono player-time">00:18 / 01:12</span>
        </div>

        <div class="review-actions" data-od-id="review-actions">
          <a class="btn btn-secondary" href="studio.html" data-od-id="review-retry">Ещё раз</a>
          <a class="btn btn-primary" href="processing.html" data-od-id="review-submit">Отправить ИИ</a>
        </div>
      </main>

      <nav class="bottom-nav" aria-label="Мобильная навигация">
        <a class="active" href="studio.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>Запись</a>
        <a href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>История</a>
        <a href="pitch-writer.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Райтер</a>
      </nav>
    </div>
  </div>
  <script src="js/pitch-ai.js"></script>
</body>
</html>
